<!-- Partial: datos del receptor (contribuyente o no) -->
<div class="card mb-3">
  <div class="card-header fw-semibold py-2 bg-primary text-white">
    <i class="bi bi-person me-1"></i>Datos del Receptor
  </div>
  <div class="card-body">
    <!-- Buscador de cliente -->
    <div class="mb-2 position-relative">
      <label class="form-label text-muted small">Buscar cliente guardado</label>
      <input type="text" id="buscar-cliente" class="form-control form-control-sm"
             placeholder="Escribí razón social, RUC o documento…"
             hx-get="/clientes/buscar"
             hx-trigger="keyup changed delay:300ms"
             hx-target="#resultados-cliente"
             name="q"
             autocomplete="off">
      <div id="resultados-cliente" class="list-group shadow-sm position-absolute w-100"
           style="z-index:1000; top:100%"></div>
    </div>

    <!-- Toggle contribuyente -->
    <div class="mb-2">
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="es-contribuyente" checked
               onchange="toggleContribuyente()">
        <label class="form-check-label" for="es-contribuyente">
          <strong>Tiene RUC</strong> <span class="text-muted small">(contribuyente)</span>
        </label>
      </div>
    </div>

    <div class="row g-3">
      <!-- Panel RUC (contribuyente=true) -->
      <div class="col-md-4" id="panel-ruc">
        <label class="form-label">RUC <span class="text-danger">*</span></label>
        <input type="text" id="ruc" class="form-control" placeholder="1234567-8">
      </div>

      <!-- Panel sin RUC (contribuyente=false) -->
      <div class="col-md-4" id="panel-no-ruc" style="display:none">
        <label class="form-label">Tipo Documento <span class="text-danger">*</span></label>
        <select id="documento_tipo" class="form-select" onchange="toggleInnominado()">
          <option value="1">Cédula paraguaya</option>
          <option value="2">Pasaporte</option>
          <option value="3">Cédula extranjera</option>
          <option value="4">Carnet de residencia</option>
          <option value="5">Innominado (sin identificación)</option>
          <option value="6">Tarjeta Diplomática</option>
          <option value="9">No especificado</option>
        </select>
      </div>
      <div class="col-md-3" id="col-doc-numero" style="display:none">
        <label class="form-label">N° Documento <span class="text-danger">*</span></label>
        <input type="text" id="documento_numero" class="form-control" placeholder="Número de documento">
      </div>

      <!-- Razón social (siempre visible) -->
      <div class="col-md-8" id="col-razon-social">
        <label class="form-label">Razón Social / Nombre <span id="razon-required" class="text-danger">*</span></label>
        <input type="text" id="razon_social" class="form-control">
      </div>

      <!-- Dirección, teléfono, email -->
      <div class="col-md-6">
        <label class="form-label">Dirección</label>
        <input type="text" id="direccion" class="form-control">
      </div>
      <div class="col-md-3">
        <label class="form-label">Teléfono</label>
        <input type="text" id="telefono" class="form-control">
      </div>
      <div class="col-md-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control">
      </div>
    </div>
  </div>
</div>
