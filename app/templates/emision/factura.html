{% extends "base.html" %}
{% block content %}
<input type="hidden" id="api-key" value="{{ api_key }}">

<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0 fw-semibold"><i class="bi bi-file-earmark-plus me-1"></i>Nueva Factura Electrónica</h5>
  <a href="/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Volver</a>
</div>

<!-- Receptor -->
<div class="card mb-3">
  <div class="card-header fw-semibold py-2 bg-primary text-white">
    <i class="bi bi-person me-1"></i>Datos del Receptor
  </div>
  <div class="card-body">
    <!-- Buscador de cliente -->
    <div class="mb-3 position-relative">
      <label class="form-label text-muted small">Buscar cliente guardado</label>
      <input type="text" id="buscar-cliente" class="form-control form-control-sm"
             placeholder="Escribí razón social o RUC…"
             hx-get="/clientes/buscar"
             hx-trigger="keyup changed delay:300ms"
             hx-target="#resultados-cliente"
             hx-include="[name='q_cliente']"
             name="q_cliente"
             autocomplete="off">
      <div id="resultados-cliente" class="list-group shadow-sm position-absolute w-100"
           style="z-index:1000; top:100%"></div>
    </div>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">RUC <span class="text-danger">*</span></label>
        <input type="text" id="ruc" class="form-control" placeholder="1234567-8" required>
      </div>
      <div class="col-md-8">
        <label class="form-label">Razón Social <span class="text-danger">*</span></label>
        <input type="text" id="razon_social" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Dirección</label>
        <input type="text" id="direccion" class="form-control">
      </div>
      <div class="col-md-3">
        <label class="form-label">Teléfono</label>
        <input type="text" id="telefono" class="form-control">
      </div>
      <div class="col-md-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control">
      </div>
    </div>
  </div>
</div>

<!-- Ítems -->
<div class="card mb-3">
  <div class="card-header fw-semibold py-2 bg-secondary text-white d-flex justify-content-between">
    <span><i class="bi bi-list-ul me-1"></i>Ítems</span>
    <button type="button" class="btn btn-sm btn-light" onclick="addItem(true)">
      <i class="bi bi-plus-circle me-1"></i>Agregar ítem
    </button>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-sm align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th style="width:80px">Código</th>
            <th>Descripción</th>
            <th style="width:90px">Cantidad</th>
            <th style="width:130px">Precio Unit.</th>
            <th style="width:90px">IVA</th>
            <th style="width:120px" class="text-end">Total</th>
            <th style="width:50px"></th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
        <tfoot>
          <tr class="table-light">
            <td colspan="5" class="text-end fw-semibold pe-3">TOTAL:</td>
            <td class="text-end fw-bold" id="total-general">₲ 0</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
</div>

<!-- Condición de pago -->
<div class="card mb-3">
  <div class="card-header fw-semibold py-2">
    <i class="bi bi-credit-card me-1"></i>Condición de Pago
  </div>
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Tipo</label>
        <select id="tipo-pago" class="form-select">
          <option value="1">Contado</option>
          <option value="2">Crédito</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Forma de pago</label>
        <select id="forma-pago" class="form-select">
          <option value="1">Efectivo</option>
          <option value="2">Cheque</option>
          <option value="3">Tarjeta de Crédito</option>
          <option value="4">Tarjeta de Débito</option>
          <option value="5">Transferencia</option>
          <option value="7">Billetera Electrónica</option>
          <option value="99">Otro</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Descripción (opcional)</label>
        <input type="text" id="descripcion" class="form-control" placeholder="Venta de mercaderías">
      </div>
    </div>
  </div>
</div>

<div id="resultado"></div>

<div class="d-flex gap-2 mt-3">
  <button type="button" id="btn-emitir" class="btn btn-primary" onclick="submitFactura()">
    <i class="bi bi-send me-1"></i>Emitir
  </button>
  <a href="/" class="btn btn-outline-secondary">Cancelar</a>
</div>

<script src="/static/emision.js"></script>
<script>
  // Autocomplete de clientes
  document.addEventListener('click', function(e) {
    const item = e.target.closest('.cliente-resultado');
    if (item) {
      document.getElementById('ruc').value          = item.dataset.ruc;
      document.getElementById('razon_social').value = item.dataset.razon;
      document.getElementById('direccion').value    = item.dataset.direccion;
      document.getElementById('telefono').value     = item.dataset.telefono;
      document.getElementById('email').value        = item.dataset.email;
      document.getElementById('buscar-cliente').value = '';
      document.getElementById('resultados-cliente').innerHTML = '';
    }
    // Cerrar resultados al hacer click fuera
    if (!e.target.closest('#buscar-cliente') && !e.target.closest('#resultados-cliente')) {
      document.getElementById('resultados-cliente').innerHTML = '';
    }
  });

  // Agregar una fila inicial
  addItem(true);

  function submitFactura() {
    const items = getItems(true);
    if (!items.length) { alert('Agregá al menos un ítem con descripción, cantidad y precio.'); return; }
    if (!document.getElementById('ruc').value.trim()) { alert('El RUC del receptor es obligatorio.'); return; }
    if (!document.getElementById('razon_social').value.trim()) { alert('La razón social es obligatoria.'); return; }

    const total = items.reduce((s, i) => s + i.cantidad * i.precio_unitario, 0);

    enviarAPI('/api/v1/facturas', {
      receptor: {
        ruc:          document.getElementById('ruc').value.trim(),
        razon_social: document.getElementById('razon_social').value.trim(),
        direccion:    document.getElementById('direccion').value.trim() || null,
        telefono:     document.getElementById('telefono').value.trim() || null,
        email:        document.getElementById('email').value.trim() || null,
      },
      items,
      condicion_pago: {
        tipo:       parseInt(document.getElementById('tipo-pago').value),
        forma_pago: parseInt(document.getElementById('forma-pago').value),
        monto:      total,
      },
      descripcion: document.getElementById('descripcion').value.trim() || null,
    });
  }
</script>
{% endblock %}
