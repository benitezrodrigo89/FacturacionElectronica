{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="d-flex align-items-center mb-3 gap-2">
      <a href="/clientes" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
      <h5 class="mb-0 fw-semibold">{{ titulo }}</h5>
    </div>
    <div class="card">
      <div class="card-body">
        <form method="post"
              action="{% if cliente %}/clientes/{{ cliente.id }}/editar{% else %}/clientes{% endif %}">
          <div class="mb-3">
            <label class="form-label fw-semibold">RUC <span class="text-danger">*</span></label>
            <input type="text" name="ruc" class="form-control"
                   value="{{ cliente.ruc if cliente else '' }}"
                   placeholder="12345678-9" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Razón Social <span class="text-danger">*</span></label>
            <input type="text" name="razon_social" class="form-control"
                   value="{{ cliente.razon_social if cliente else '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Dirección</label>
            <input type="text" name="direccion" class="form-control"
                   value="{{ cliente.direccion if cliente else '' }}">
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Teléfono</label>
              <input type="text" name="telefono" class="form-control"
                     value="{{ cliente.telefono if cliente else '' }}">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" class="form-control"
                     value="{{ cliente.email if cliente else '' }}">
            </div>
          </div>
          <div class="d-flex gap-2 justify-content-end">
            <a href="/clientes" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
