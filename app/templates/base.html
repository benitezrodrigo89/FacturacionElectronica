<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>SIFEN Paraguay — Facturación Electrónica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    body { background: #f4f6f9; font-size: .93rem; }
    .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.15); }
    .navbar-brand { font-weight: 700; letter-spacing: .3px; }
    .nav-link.active { font-weight: 600; }
    .badge-aprobado  { background-color: #198754; color: #fff; }
    .badge-rechazado { background-color: #dc3545; color: #fff; }
    .badge-pendiente { background-color: #fd7e14; color: #fff; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .stat-number { font-size: 1.8rem; font-weight: 700; line-height: 1; }
    code.cdc { font-size: .72rem; color: #6c757d; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    /* Mobile: tablas con scroll horizontal */
    .table-responsive { -webkit-overflow-scrolling: touch; }
    /* Botones más grandes en touch */
    @media (max-width: 576px) {
      .btn-sm { min-height: 36px; }
      .stat-number { font-size: 1.4rem; }
      .card.p-3 { padding: .75rem !important; }
      .table { font-size: .8rem; }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-3">
  <div class="container-lg">
    <a class="navbar-brand" href="/"><i class="bi bi-receipt-cutoff me-1"></i>SIFEN</a>

    <!-- Botón hamburguesa para mobile -->
    <button class="navbar-toggler border-0 d-lg-none" type="button"
            data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menú colapsable -->
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-1 py-2 py-lg-0">

        <li class="nav-item">
          <a href="/" class="nav-link text-white {% if request.url.path == '/' %}active{% endif %}">
            <i class="bi bi-grid-1x2 me-1"></i>Dashboard
          </a>
        </li>

        <!-- Dropdown Emitir -->
        <li class="nav-item dropdown">
          <a class="nav-link text-white dropdown-toggle {% if '/emitir/' in request.url.path %}active{% endif %}"
             href="#" role="button" data-bs-toggle="dropdown">
            <i class="bi bi-plus-circle me-1"></i>Emitir
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/emitir/factura">
              <span class="badge bg-primary me-2">FE</span>Factura Electrónica
            </a></li>
            <li><a class="dropdown-item" href="/emitir/nota-credito">
              <span class="badge bg-warning text-dark me-2">NCE</span>Nota de Crédito
            </a></li>
            <li><a class="dropdown-item" href="/emitir/nota-remision">
              <span class="badge bg-secondary me-2">NRE</span>Nota de Remisión
            </a></li>
          </ul>
        </li>

        <!-- Dropdown Maestros -->
        <li class="nav-item dropdown">
          <a class="nav-link text-white dropdown-toggle {% if request.url.path.startswith('/clientes') or request.url.path.startswith('/productos') %}active{% endif %}"
             href="#" role="button" data-bs-toggle="dropdown">
            <i class="bi bi-database me-1"></i>Maestros
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/clientes">
              <i class="bi bi-people me-2"></i>Clientes
            </a></li>
            <li><a class="dropdown-item" href="/productos">
              <i class="bi bi-box-seam me-2"></i>Productos / Servicios
            </a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a href="/configuracion" class="nav-link text-white {% if request.url.path == '/configuracion' %}active{% endif %}">
            <i class="bi bi-gear me-1"></i>Configuración
          </a>
        </li>
        <li class="nav-item">
          <a href="/api/docs" class="nav-link text-white" target="_blank">
            <i class="bi bi-code-slash me-1"></i>API
          </a>
        </li>

      </ul>
    </div>
  </div>
</nav>

<div class="container-lg pb-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
