{% if facturas %}
<div class="mt-2">
  <label class="form-label text-muted small fw-semibold">
    <i class="bi bi-file-earmark-text me-1"></i>Facturas aprobadas del receptor — seleccioná la que querés acreditar
  </label>
  <div class="list-group">
    {% for f in facturas %}
    <button type="button"
            class="list-group-item list-group-item-action py-2 factura-ref-item"
            data-cdc="{{ f.cdc }}"
            data-nro="{{ f.nro }}"
            data-monto="{{ f.monto }}"
            data-fecha="{{ f.fecha }}">
      <div class="d-flex justify-content-between align-items-center">
        <span class="fw-semibold font-monospace small">{{ f.nro }}</span>
        <span class="fw-semibold text-primary small">{{ f.monto_str }}</span>
      </div>
      <div class="text-muted" style="font-size:.75rem">
        {{ f.fecha }} &nbsp;·&nbsp;
        <span class="font-monospace">{{ f.cdc[:20] }}…</span>
      </div>
    </button>
    {% endfor %}
  </div>
</div>
{% elif ruc %}
<div class="mt-2 text-muted small">
  <i class="bi bi-info-circle me-1"></i>No hay facturas aprobadas para este RUC en el sistema.
</div>
{% endif %}
