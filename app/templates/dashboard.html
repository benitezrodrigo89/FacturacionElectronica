{% extends "base.html" %}
{% block content %}
<input type="hidden" id="api-key" value="{{ api_key }}">

<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0 fw-semibold"><i class="bi bi-file-earmark-text me-1"></i>Documentos Electrónicos</h5>
  <a href="/api/docs#/Facturas/emitir_factura_api_v1_facturas_post"
     class="btn btn-primary btn-sm" target="_blank">
    <i class="bi bi-plus-circle me-1"></i>Emitir vía API
  </a>
</div>

<!-- Filtros: período + estado -->
<div class="d-flex flex-wrap gap-2 mb-3 align-items-center">

  <!-- Período -->
  <div class="btn-group" role="group" id="filtros-periodo">
    <button class="btn btn-primary btn-sm active" data-periodo="hoy"
            onclick="filtrar(this)">
      <i class="bi bi-calendar-day me-1"></i>Hoy
    </button>
    <button class="btn btn-outline-primary btn-sm" data-periodo="semana"
            onclick="filtrar(this)">
      <i class="bi bi-calendar-week me-1"></i>Semana
    </button>
    <button class="btn btn-outline-primary btn-sm" data-periodo="mes"
            onclick="filtrar(this)">
      <i class="bi bi-calendar-month me-1"></i>Mes
    </button>
    <button class="btn btn-outline-primary btn-sm" data-periodo="todo"
            onclick="filtrar(this)">
      <i class="bi bi-calendar3 me-1"></i>Todo
    </button>
  </div>

  <!-- Estado -->
  <div class="btn-group" role="group" id="filtros-estado">
    <button class="btn btn-outline-secondary btn-sm active" data-estado=""
            onclick="filtrar(this)">
      Todos
    </button>
    <button class="btn btn-outline-success btn-sm" data-estado="aprobado"
            onclick="filtrar(this)">
      <i class="bi bi-check-circle me-1"></i>Aprobados
    </button>
    <button class="btn btn-outline-danger btn-sm" data-estado="rechazado"
            onclick="filtrar(this)">
      <i class="bi bi-x-circle me-1"></i>Rechazados
    </button>
    <button class="btn btn-outline-warning btn-sm" data-estado="pendiente"
            onclick="filtrar(this)">
      <i class="bi bi-clock me-1"></i>Pendientes
    </button>
  </div>

  <span id="spinner" class="htmx-indicator spinner-border spinner-border-sm text-secondary"></span>
</div>

<!-- Contenido cargado por HTMX -->
<div id="content"
     hx-get="/documentos-tabla?periodo=hoy"
     hx-trigger="load"
     hx-swap="innerHTML">
  <div class="text-center py-5 text-muted">
    <div class="spinner-border spinner-border-sm"></div> Cargando...
  </div>
</div>

<!-- Modal consultar estado -->
<div class="modal fade" id="modalConsulta" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-secondary text-white">
        <h5 class="modal-title"><i class="bi bi-arrow-repeat me-1"></i>Estado en SIFEN</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="consulta-body">
        <div class="text-center py-3">
          <div class="spinner-border text-secondary"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal anulación -->
<div class="modal fade" id="modalAnular" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title"><i class="bi bi-x-circle me-1"></i>Anular Documento</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-3">
          Documento N° <strong id="anular-numero"></strong>
          <br><code id="anular-cdc" class="small"></code>
        </p>
        <div class="mb-3">
          <label class="form-label fw-semibold">Motivo de anulación <span class="text-danger">*</span></label>
          <textarea id="anular-motivo" class="form-control" rows="3"
                    placeholder="Ej: Error en datos del receptor" minlength="5"></textarea>
        </div>
        <div id="anular-resultado" class="d-none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btn-confirmar-anular"
                onclick="confirmarAnulacion()">
          <span id="anular-spinner" class="spinner-border spinner-border-sm d-none me-1"></span>
          Confirmar Anulación
        </button>
      </div>
    </div>
  </div>
</div>

<script>
async function consultarEstado(cdc, btn) {
  const body = document.getElementById('consulta-body');
  body.innerHTML = '<div class="text-center py-3"><div class="spinner-border text-secondary"></div><p class="mt-2 text-muted small">Consultando SIFEN...</p></div>';
  new bootstrap.Modal(document.getElementById('modalConsulta')).show();

  try {
    const resp = await fetch(`/api/v1/facturas/${cdc}/consultar`, {
      method: 'POST',
      headers: { 'X-API-Key': document.getElementById('api-key').value },
    });
    const data = await resp.json();

    if (resp.ok) {
      const estadoClass = data.estado_sifen === 'Aprobado' ? 'success' : 'warning';
      body.innerHTML = `
        <table class="table table-sm mb-0">
          <tr><th>CDC</th><td><code class="small">${cdc.substring(0,20)}…</code></td></tr>
          <tr><th>Estado SIFEN</th><td><span class="badge bg-${estadoClass}">${data.estado_sifen || '—'}</span></td></tr>
          <tr><th>Código</th><td>${data.codigo_sifen}</td></tr>
          <tr><th>Descripción</th><td>${data.descripcion}</td></tr>
          ${data.protocolo_autorizacion ? `<tr><th>Protocolo</th><td><strong>${data.protocolo_autorizacion}</strong></td></tr>` : ''}
        </table>`;
      recargarTabla();
    } else {
      body.innerHTML = `<div class="alert alert-danger mb-0">${data.detail || 'Error al consultar'}</div>`;
    }
  } catch (e) {
    body.innerHTML = `<div class="alert alert-danger mb-0">Error de conexión: ${e.message}</div>`;
  }
}

function getPeriodo() {
  const btn = document.querySelector('#filtros-periodo .active');
  return btn ? btn.dataset.periodo : 'hoy';
}

function getEstado() {
  const btn = document.querySelector('#filtros-estado .active');
  return btn ? btn.dataset.estado : '';
}

function recargarTabla() {
  const p = getPeriodo();
  const e = getEstado();
  const qs = `periodo=${p}${e ? '&estado=' + e : ''}`;
  htmx.ajax('GET', `/documentos-tabla?${qs}`, {target: '#content', swap: 'innerHTML'});
}

function filtrar(btn) {
  const grupo = btn.closest('.btn-group');
  grupo.querySelectorAll('button').forEach(b => {
    b.classList.remove('active');
    b.classList.add(b.classList.contains('btn-primary') ? 'btn-outline-primary' :
                    b.classList.contains('btn-success') ? 'btn-outline-success' :
                    b.classList.contains('btn-danger')  ? 'btn-outline-danger'  :
                    b.classList.contains('btn-warning') ? 'btn-outline-warning' : 'btn-outline-secondary');
    b.classList.remove('btn-primary','btn-success','btn-danger','btn-warning','btn-secondary');
  });
  btn.classList.add('active');
  // Quitar outline del botón activo
  ['btn-outline-primary','btn-outline-success','btn-outline-danger',
   'btn-outline-warning','btn-outline-secondary'].forEach(c => btn.classList.remove(c));
  recargarTabla();
}

function setActive(btn) {
  filtrar(btn);
}

function prepararAnulacion(btn) {
  document.getElementById('anular-cdc').textContent    = btn.dataset.cdc;
  document.getElementById('anular-numero').textContent = btn.dataset.numero;
  document.getElementById('anular-motivo').value       = '';
  document.getElementById('anular-resultado').className = 'd-none';
}

async function confirmarAnulacion() {
  const cdc    = document.getElementById('anular-cdc').textContent;
  const motivo = document.getElementById('anular-motivo').value.trim();
  if (motivo.length < 5) {
    alert('El motivo debe tener al menos 5 caracteres.');
    return;
  }

  const spinner = document.getElementById('anular-spinner');
  const btn     = document.getElementById('btn-confirmar-anular');
  spinner.classList.remove('d-none');
  btn.disabled = true;

  try {
    const resp = await fetch(`/api/v1/documentos/${cdc}/cancelar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': document.getElementById('api-key').value },
      body: JSON.stringify({ motivo }),
    });
    const data = await resp.json();
    const res  = document.getElementById('anular-resultado');
    if (resp.ok) {
      res.innerHTML = `<div class="alert alert-success mb-0">
        <strong>Código SIFEN:</strong> ${data.codigo_sifen} — ${data.descripcion}<br>
        <strong>Estado:</strong> ${data.estado}
      </div>`;
      res.className = '';
      // Cerrar modal y recargar tabla
      setTimeout(() => {
        bootstrap.Modal.getInstance(document.getElementById('modalAnular')).hide();
        recargarTabla();
      }, 1500);
    } else {
      res.innerHTML = `<div class="alert alert-danger mb-0">${data.detail || 'Error al anular'}</div>`;
      res.className = '';
    }
  } catch (e) {
    alert('Error de conexión: ' + e.message);
  } finally {
    spinner.classList.add('d-none');
    btn.disabled = false;
  }
}
</script>
{% endblock %}
